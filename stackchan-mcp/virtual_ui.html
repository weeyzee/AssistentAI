<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Марк — виртуальный Stack-chan</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px; font: 16px/1.4 -apple-system, system-ui, sans-serif;
    background: #101014; color: #e8e8ea;
    display: flex; flex-direction: column; gap: 12px; align-items: center;
    min-height: 100dvh;
  }
  #faceWrap {
    width: min(92vw, 460px); aspect-ratio: 320 / 172; border-radius: 18px; overflow: hidden;
    background: #050608; box-shadow: 0 0 0 1px #2a2a36, 0 8px 30px #0008;
  }
  #faceCanvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #status { font-size: 14px; color: #9a9aa6; min-height: 20px; text-align: center; }
  #status.off { color: #ff8080; }
  .row { display: flex; gap: 10px; width: min(92vw, 460px); }
  button {
    flex: 1; padding: 16px 8px; font-size: 16px; font-weight: 600; color: #fff;
    background: #2a2a36; border: 1px solid #3a3a4a; border-radius: 14px;
  }
  button:active { background: #3a3a4a; }
  button.on { background: #7a2230; border-color: #b03040; }
  button.rec { background: #a02030; border-color: #e04050; }
  #log {
    width: min(92vw, 460px); flex: 1; min-height: 80px; overflow-y: auto;
    font: 13px/1.5 ui-monospace, monospace; color: #8f8f9c;
    background: #17171d; border-radius: 12px; padding: 10px 12px;
  }
  #log div { margin-bottom: 2px; }
</style>
</head>
<body>

<div id="faceWrap"><canvas id="faceCanvas"></canvas></div>
<div id="status">соединяюсь…</div>

<div class="row">
  <button id="btnMic">🎤 Говорить</button>
  <button id="btnCam">📷 Камера</button>
</div>
<div class="row">
  <button id="btnPet">🖐 Погладить</button>
  <button id="btnSound">🔊 Звук</button>
</div>

<div id="log"></div>

<audio id="player"></audio>
<video id="cam" playsinline muted hidden></video>
<canvas id="snap" width="320" height="240" hidden></canvas>

<script src="/face_engine.js"></script>
<script>
const face = new StackchanFace(document.getElementById('faceCanvas'));
face.start();
window.__face = face;   // для отладки и тестов

const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const player = document.getElementById('player');
const camEl = document.getElementById('cam');
const canvas = document.getElementById('snap');
const ctx2d = canvas.getContext('2d');

let lastEventId = 0, recording = false, recorder = null, chunks = [];
let camStream = null, camTimer = null, connected = false;
let audioCtx = null, analyser = null, analyserData = null;
let lastActivity = Date.now();

// --- журнал и статус ---
function log(msg) {
  const div = document.createElement('div');
  div.textContent = new Date().toLocaleTimeString('ru-RU') + '  ' + msg;
  logEl.prepend(div);
  while (logEl.childElementCount > 40) logEl.lastChild.remove();
}
function status(text, off) {
  statusEl.textContent = text;
  statusEl.classList.toggle('off', !!off);
}
function setConnected(ok) {
  if (ok === connected) return;
  connected = ok;
  if (!ok) { face.setState('ERROR'); status('нет связи с сервером', true); }
  else { face.setState('IDLE'); status('на связи'); }
}
function touch() {
  lastActivity = Date.now();
  if (face.state === 'SLEEPING') face.setState('IDLE');
}

// --- звук: разблокировка и анализатор громкости для рта ---
document.addEventListener('pointerdown', async () => {
  touch();
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !audioCtx) {
      audioCtx = new AC();
      await audioCtx.resume();
      const src = audioCtx.createMediaElementSource(player);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyserData = new Uint8Array(analyser.fftSize);
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
      log('звук разблокирован');
    } else if (audioCtx) {
      await audioCtx.resume();
    }
  } catch (e) { log('звук: ' + e.message); }
}, { once: false });

function readAudioLevel() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(analyserData);
  let sum = 0;
  for (let i = 0; i < analyserData.length; i++) {
    const v = (analyserData[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / analyserData.length) * 3.2);
}

player.addEventListener('ended', () => {
  fetch('/web/played', { method: 'POST' }).catch(() => {});
  face.setAudioLevel(0);
  face.setState('HAPPY', 3500);
});

// --- события от сервера ---
const FACE_MAP = {
  calm: 'IDLE', thinking: 'THINKING', happy: 'HAPPY', sleepy: 'SLEEPING',
  shy: 'HAPPY', smug: 'IDLE', pouty: 'SURPRISED',
};

function handleEvent(ev) {
  touch();
  switch (ev.type) {
    case 'play':
      log('🔊 говорю');
      face.setState('SPEAKING');
      player.src = ev.url + '?t=' + Date.now();
      player.play().catch(e => log('аудио: ' + e.message + ' — нажми «Звук»'));
      break;
    case 'face': {
      const mapped = FACE_MAP[ev.face] || 'IDLE';
      log(`😐 морда: ${ev.face} → ${mapped}`);
      face.setState(mapped, mapped === 'IDLE' ? 0 : 5000);
      break;
    }
    case 'nod':    log('✅ киваю'); face.setState('HAPPY', 1600); break;
    case 'shake':  log('❌ мотаю головой'); face.setState('SURPRISED', 1600); break;
    case 'move':
      log('↔️ поворот');
      face.setGaze((ev.x || 0) / 128 * 6, -(ev.y || 0) / 90 * 4);
      setTimeout(() => face.setGaze(0, 0), 2500);
      break;
    case 'home':   log('🏠 в исходную'); face.setGaze(0, 0); break;
    case 'image':  log('👁 смотрю');
      showPhoto();
      break;
    case 'recording': log('✅ запись принята'); break;
    case 'pet':    log('🖐 погладили!'); face.setState('HAPPY', 4000); break;
    case 'tap':    log('👆 тап по полосе'); face.setState('SURPRISED', 1200); break;
  }
}

function showPhoto() {
  const img = new Image();
  img.onload = () => face.showPhoto(img, 6000);
  img.src = '/web/frame.jpg?t=' + Date.now();
}

async function poll() {
  try {
    const r = await fetch('/web/poll?since=' + lastEventId, { cache: 'no-store' });
    const data = await r.json();
    lastEventId = data.next;
    for (const ev of data.events) handleEvent(ev);
    setConnected(true);
  } catch (e) { setConnected(false); }
  // сон после 3 минут тишины
  if (face.state === 'IDLE' && Date.now() - lastActivity > 180000) {
    face.setState('SLEEPING');
  }
  if (face.state === 'SPEAKING') {
    face.setAudioLevel(readAudioLevel());
  }
  setTimeout(poll, 150);
}

// --- кнопки ---
const btnMic = document.getElementById('btnMic');
const btnCam = document.getElementById('btnCam');
const btnPet = document.getElementById('btnPet');
const btnSound = document.getElementById('btnSound');

function updateMicBtn() {
  btnMic.textContent = recording ? '⏹ Готово' : '🎤 Говорить';
  btnMic.classList.toggle('rec', recording);
}

btnMic.addEventListener('click', async () => {
  touch();
  if (recording && recorder) { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', ''];
    const mime = candidates.find(m => !m || (window.MediaRecorder && MediaRecorder.isTypeSupported(m)));
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      recording = false; updateMicBtn();
      face.setState('THINKING');
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      log('отправляю запись (' + blob.size + ' байт)…');
      try {
        const r = await fetch('/web/mic', { method: 'POST', body: blob });
        const d = await r.json();
        log(d.ok ? '✅ принято — Марк сейчас ответит…' : '❌ ' + d.error);
        if (!d.ok) face.setState('ERROR', 3000);
      } catch (e) { log('❌ ' + e.message); face.setState('ERROR', 3000); }
    };
    recorder.start();
    recording = true; updateMicBtn();
    face.setState('LISTENING');
    log('🎤 записываю…');
  } catch (e) { log('микрофон: ' + e.message); face.setState('ERROR', 3000); }
});

btnCam.addEventListener('click', async () => {
  touch();
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    clearInterval(camTimer); camTimer = null;
    btnCam.classList.remove('on');
    log('📷 камера выключена');
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 } } });
    camEl.srcObject = camStream;
    await camEl.play().catch(() => {});
    camTimer = setInterval(sendFrame, 2000);
    btnCam.classList.add('on');
    sendFrame();
    log('📷 камера включена');
  } catch (e) { log('камера: ' + e.message); face.setState('ERROR', 3000); }
});

async function sendFrame() {
  if (!camEl.videoWidth) return;
  ctx2d.drawImage(camEl, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(async blob => {
    if (!blob) return;
    try { await fetch('/web/frame', { method: 'POST', body: blob }); } catch (e) {}
  }, 'image/jpeg', 0.6);
}

btnPet.addEventListener('click', async () => {
  touch();
  try { await fetch('/web/pet', { method: 'POST' }); } catch (e) { log(e.message); }
});

btnSound.addEventListener('click', () => {
  touch();
  player.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  player.play().then(() => log('звук включён')).catch(e => log('звук: ' + e.message));
});

poll();
log('страница загружена');
</script>
</body>
</html>
